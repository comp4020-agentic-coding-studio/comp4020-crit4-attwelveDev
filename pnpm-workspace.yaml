# esbuild (used by Vite) needs its postinstall to set up its native binary.
allowBuilds:
  esbuild: true
  # Transformers.js ships both runtimes. Only the browser one is ever loaded
  # here --- the model runs client-side on onnxruntime-web --- so none of these
  # native postinstalls need to run, and denying them keeps CI installs from
  # building binaries this site cannot use.
  onnxruntime-node: false
  protobufjs: false
  sharp: false
